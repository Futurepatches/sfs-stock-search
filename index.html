<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFS | Inventory System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root {
  --primary:#1E4D9C;
  --bg:#F8FAFC;
}

body {
  font-family: Inter;
  background: var(--bg);
  margin:0;
  padding:20px;
}

.container {
  max-width:1000px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  border-top:6px solid var(--primary);
}

h1 {
  text-align:center;
  color:var(--primary);
}

.search-box {
  width:100%;
  padding:14px;
  font-size:16px;
  border:2px solid #ddd;
  border-radius:10px;
}

.search-box:focus {
  border-color:var(--primary);
  outline:none;
}

/* TABLE */
table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th {
  background:#1E4D9C;
  color:white;
  padding:12px;
  font-size:13px;
}

td {
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

.part {
  color:var(--primary);
  font-weight:bold;
}

/* IMAGE */
img {
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
  cursor:pointer;
}

/* POPUP */
.popup {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popup img {
  max-width:90%;
  max-height:90%;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>LIVE INVENTORY SEARCH</h1>

<input type="text" id="searchInput" class="search-box" placeholder="Search Part Number...">

<table>
<thead>
<tr>
  <th>Image</th>
  <th>Part No</th>
  <th>Location</th>
  <th>Description</th>
  <th>Stock</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

</div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="closePopup()">
  <img id="popupImg">
</div>

<script>

const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSS4E1DvaV4RzuMHMENiroSR4WYZjT0usnqAgUwX-W44ADM-sB1Gz8lYNvK51-WP88BYi4lYLxwZaU3/pub?output=csv";

let data = [];

async function loadData(){
  const res = await fetch(URL);
  const txt = await res.text();
  const rows = Papa.parse(txt).data;

  data = rows.slice(1).map(r => ({
    part: r[0] || "",
    location: r[1] || "",
    desc: r[2] || "",
    stock: r[3] || 0,
    image: r[4] || ""
  }));
}

function render(list){
  let body = document.getElementById("body");

  body.innerHTML = list.map(i => `
    <tr>
      <td>
        <img src="${i.image}" onclick="openPopup('${i.image}')">
      </td>
      <td class="part">${i.part}</td>
      <td>${i.location}</td>
      <td>${i.desc}</td>
      <td>${i.stock}</td>
    </tr>
  `).join("");
}

function search(){
  let val = searchInput.value.toLowerCase();

  let filtered = data.filter(i =>
    i.part.toLowerCase().includes(val) ||
    i.desc.toLowerCase().includes(val) ||
    i.location.toLowerCase().includes(val)
  );

  render(filtered);
}

searchInput.addEventListener("input", search);

function openPopup(src){
  document.getElementById("popup").style.display = "flex";
  document.getElementById("popupImg").src = src;
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

loadData();

</script>

</body>
</html>
