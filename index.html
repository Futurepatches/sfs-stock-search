<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

body{
  margin:0;
  font-family:Inter;
  background:#f3f6fb;
  padding:25px;
}

/* MAIN CARD */
.container{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,0.08);
  border-top:6px solid #1E4D9C;
}

/* HEADER */
h1{
  text-align:center;
  color:#1E4D9C;
  margin-bottom:5px;
}

p{
  text-align:center;
  color:#666;
  margin-top:0;
}

/* SEARCH */
.search{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:10px;
  border:2px solid #ddd;
  margin-top:15px;
}

.search:focus{
  outline:none;
  border-color:#1E4D9C;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  overflow:hidden;
  border-radius:12px;
}

th{
  background:#1E4D9C;
  color:white;
  padding:14px;
  font-size:13px;
}

td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

tr:hover{
  background:#f6f9ff;
}

/* PART STYLE */
.part{
  color:#1E4D9C;
  font-weight:600;
}

/* IMAGE */
img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #ddd;
  cursor:pointer;
  transition:0.2s;
}

img:hover{
  transform:scale(1.05);
}

/* POPUP */
.popup{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popup img{
  max-width:98vw;
  max-height:98vh;
  object-fit:contain;
  background:white;
  padding:10px;
  border-radius:12px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

/* STOCK */
.stock{
  font-weight:600;
}

.low{
  color:red;
}

</style>
</head>

<body>

<div class="container">

<h1>LIVE INVENTORY SYSTEM</h1>
<p>Search Part Number & View Stock Instantly</p>

<input type="text" id="searchInput" class="search" placeholder="Search Part Number...">

<table>
<thead>
<tr>
  <th>Image</th>
  <th>Part No</th>
  <th>Location</th>
  <th>Description</th>
  <th>Stock</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

</div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="closePopup()">
  <img id="popupImg">
</div>

<script>

const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSS4E1DvaV4RzuMHMENiroSR4WYZjT0usnqAgUwX-W44ADM-sB1Gz8lYNvK51-WP88BYi4lYLxwZaU3/pub?output=csv";

let data = [];

async function loadData(){
  const res = await fetch(URL);
  const txt = await res.text();
  const rows = Papa.parse(txt).data;

  data = rows.slice(1).map(r => ({
    part: r[0] || "",
    location: r[1] || "",
    desc: r[2] || "",
    stock: r[3] || 0,
    image: r[4] || ""
  }));

  render(data);
}

function render(list){
  document.getElementById("body").innerHTML = list.map(i => {
    let low = parseFloat(i.stock) <= 0;

    return `
    <tr>
      <td>
        <img src="${i.image}" onclick="openPopup('${i.image}')">
      </td>
      <td class="part">${i.part}</td>
      <td>${i.location}</td>
      <td>${i.desc}</td>
      <td class="stock ${low ? 'low' : ''}">${i.stock}</td>
    </tr>
    `;
  }).join("");
}

function search(){
  let val = searchInput.value.toLowerCase();

  let filtered = data.filter(i =>
    i.part.toLowerCase().includes(val) ||
    i.desc.toLowerCase().includes(val) ||
    i.location.toLowerCase().includes(val)
  );

  render(filtered);
}

searchInput.addEventListener("input", search);

/* POPUP */
function openPopup(src){
  document.getElementById("popup").style.display = "flex";
  document.getElementById("popupImg").src = src;
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

loadData();

</script>

</body>
</html>
