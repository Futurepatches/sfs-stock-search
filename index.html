<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFS | Inventory System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root {
  --primary:#1E4D9C;
  --success:#10B981;
  --danger:#E73B32;
  --bg:#F8FAFC;
}

body {
  font-family: Inter;
  background: var(--bg);
  margin:0;
  padding:20px;
}

.container {
  max-width:950px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
  border-top:8px solid var(--primary);
}

.header { text-align:center; margin-bottom:25px; }
.header h1 { color:var(--primary); font-size:28px; margin:0; }
.header p { color:#64748B; font-size:14px; font-weight:600; }

.status-bar {
  text-align:center;
  padding:12px;
  border-radius:10px;
  font-weight:600;
  margin-bottom:20px;
}

.online { background:#D1FAE5; color:#065F46; }
.offline { background:#FEE2E2; color:#991B1B; }

.search-box { position:relative; margin-bottom:15px; }

#searchInput {
  width:100%;
  padding:16px;
  font-size:16px;
  border-radius:10px;
  border:2px solid #ddd;
}

#suggestions {
  position:absolute;
  width:100%;
  background:white;
  border:1px solid #ddd;
  max-height:200px;
  overflow:auto;
  display:none;
  z-index:10;
}

.suggestion {
  padding:10px;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse:collapse;
}

th {
  background:#F1F5F9;
  padding:12px;
}

td {
  padding:12px;
  border-bottom:1px solid #eee;
}

.part-no { color:var(--primary); font-weight:bold; }

/* IMAGE STYLE */
.product-img {
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>STANDARD FLUID SYSTEMS</h1>
    <p>Live Inventory Search Portal</p>
  </div>

  <div class="status-bar" id="statusBar">Loading...</div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search part..." disabled>
    <div id="suggestions"></div>
  </div>

  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th>Image</th>
        <th>Part Number</th>
        <th>Location</th>
        <th>Description</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>

</div>

<script>

const URL = "YOUR_GOOGLE_SHEET_CSV_URL";

let data = [];

async function loadData(){
 const status = document.getElementById("statusBar");

 try {
  const res = await fetch(URL);
  const txt = await res.text();
  const rows = Papa.parse(txt).data;

  data = rows.slice(1).map(r=>({
    part:r[0]||"",
    location:r[1]||"",
    desc:r[2]||"",
    stock:r[3]||0,
    image:r[4]||""   // ✅ IMAGE ADDED
  })).filter(i=>i.part);

  status.className = "status-bar online";
  status.innerHTML = "✅ System Online";

  document.getElementById("searchInput").disabled=false;

 } catch(e) {
  status.className = "status-bar offline";
  status.innerHTML = "❌ Connection Failed";
 }
}

function render(list){
 let body = document.getElementById("body");
 let table = document.getElementById("table");

 table.style.display="table";

 body.innerHTML = list.map(i=>{
  return `
  <tr>
    <td><img class="product-img" src="${i.image}"></td>
    <td class="part-no">${i.part}</td>
    <td>${i.location}</td>
    <td>${i.desc}</td>
    <td>${i.stock}</td>
  </tr>`;
 }).join("");
}

function search(){
 let val = searchInput.value.toLowerCase();

 let filtered = data.filter(i=>{
  return (
   i.part.toLowerCase().includes(val) ||
   i.desc.toLowerCase().includes(val)
  );
 });

 render(filtered);
}

searchInput.addEventListener("input", search);

loadData();
setInterval(loadData,60000);

</script>

</body>
</html>
