<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFS Inventory System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,sans-serif;
  background:#f2f6fc;
  padding:20px;
}

.container{
  max-width:1400px;
  margin:auto;
  background:#fff;
  border-radius:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
  padding:25px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  color:#1E4D9C;
  font-size:34px;
}

.header p{
  color:#666;
  margin-top:5px;
}

.controls{
  display:flex;
  gap:15px;
  margin-bottom:20px;
}

.controls input,
.controls select{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:15px;
}

.controls input:focus,
.controls select:focus{
  outline:none;
  border-color:#1E4D9C;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#1E4D9C;
  color:#fff;
  padding:14px;
  font-size:13px;
}

td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #eee;
}

tr:hover{
  background:#f8fbff;
}

.product-img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  border:1px solid #ddd;
}

.details-btn{
  background:#1E4D9C;
  color:#fff;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}

.details-btn:hover{
  background:#163b77;
}

.low-stock{
  color:red;
  font-weight:700;
}

.popup,
.details-popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.popup-content{
  text-align:center;
}

.popup img{
  max-width:90vw;
  max-height:80vh;
  object-fit:contain;
}

.zoom-controls{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:10px;
}

.zoom-controls button{
  padding:12px 16px;
  border:none;
  background:#1E4D9C;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}

.details-box{
  width:95%;
  max-width:1200px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:25px;
}

.section-title{
  color:#1E4D9C;
  margin:20px 0 10px;
}

.history-table{
  width:100%;
  border-collapse:collapse;
}

.history-table th{
  background:#1E4D9C;
  color:white;
}

.history-table td{
  border:1px solid #ddd;
}

.close-btn{
  background:red;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}
</style></head>
<body>

<div class="container">

  <div class="header">
    <h1>SFS LIVE INVENTORY</h1>
    <p>Search Parts, Stock, Import & Return History</p>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search model, location or description...">
    
    <select id="locationFilter">
      <option value="">All Locations</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Image</th>
        <th>Model</th>
        <th>Location</th>
        <th>Description</th>
        <th>Stock</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</div>

<!-- IMAGE POPUP -->
<div class="popup" id="imagePopup">
  <div class="popup-content">
    <img id="popupImage">

    <div class="zoom-controls">
      <button onclick="zoomIn()">+</button>
      <button onclick="zoomOut()">-</button>
      <button onclick="resetZoom()">Reset</button>
      <button onclick="closePopup()">Close</button>
    </div>
  </div>
</div>

<!-- DETAILS POPUP -->
<div class="details-popup" id="detailsPopup">
  <div class="details-box">

    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="color:#1E4D9C;">Product Details</h2>
      <button class="close-btn" onclick="closeDetails()">Close</button>
    </div>

    <div id="productInfo"></div>

    <h3 class="section-title">Import History</h3>
    <div id="importHistory"></div>

    <h3 class="section-title">Sales History</h3>
    <div id="salesHistory"></div>

    <h3 class="section-title">Return History</h3>
    <div id="returnHistory"></div>

  </div>
</div>

<script>
const STOCK_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSS4E1DvaV4RzuMHMENiroSR4WYZjT0usnqAgUwX-W44ADM-sB1Gz8lYNvK51-WP88BYi4lYLxwZaU3/pub?gid=1719776219&single=true&output=csv";
const IMPORT_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSS4E1DvaV4RzuMHMENiroSR4WYZjT0usnqAgUwX-W44ADM-sB1Gz8lYNvK51-WP88BYi4lYLxwZaU3/pub?gid=1389271409&single=true&output=csv";
const RETURN_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSS4E1DvaV4RzuMHMENiroSR4WYZjT0usnqAgUwX-W44ADM-sB1Gz8lYNvK51-WP88BYi4lYLxwZaU3/pub?gid=1032386368&single=true&output=csv";

let stockData = [];
let importData = [];
let returnData = [];
let zoomLevel = 1;
async function loadAllData() {
  try {
    const stockRes = await fetch(STOCK_URL);
    const stockText = await stockRes.text();
    stockData = Papa.parse(stockText).data;

    const importRes = await fetch(IMPORT_URL);
    const importText = await importRes.text();
    importData = Papa.parse(importText).data;

    const returnRes = await fetch(RETURN_URL);
    const returnText = await returnRes.text();
    returnData = Papa.parse(returnText).data;

    fillLocations();
    renderTable();

  } catch (error) {
    alert("Connection Failed");
    console.error(error);
  }
}

function fillLocations(){
  const filter = document.getElementById("locationFilter");
  let locations = [...new Set(stockData.slice(1).map(row => row[1]).filter(Boolean))];

  locations.forEach(loc => {
    let option = document.createElement("option");
    option.value = loc;
    option.textContent = loc;
    filter.appendChild(option);
  });
}

function renderTable(data = stockData.slice(1)){
  const body = document.getElementById("tableBody");

  body.innerHTML = data.map(row => {
    const model = row[0] || "";
    const location = row[1] || "";
    const description = row[2] || "";
    const image = row[4] || "";
    const stock = row[6] || "0";

    return `
      <tr>
        <td>
          ${image ? `<img src="${image}" class="product-img" onclick="openPopup('${image}')">` : 'No Image'}
        </td>
        <td>${model}</td>
        <td>${location}</td>
        <td>${description}</td>
        <td class="${parseFloat(stock)<=0 ? 'low-stock' : ''}">${stock}</td>
        <td>
          <button class="details-btn" onclick="showDetails('${model}')">Details</button>
        </td>
      </tr>
    `;
  }).join("");
}

function filterData(){
  const search = document.getElementById("searchInput").value.toLowerCase();
  const location = document.getElementById("locationFilter").value;

  const filtered = stockData.slice(1).filter(row => {
    const model = (row[0] || "").toLowerCase();
    const loc = (row[1] || "").toLowerCase();
    const desc = (row[2] || "").toLowerCase();

    const searchMatch =
      model.includes(search) ||
      loc.includes(search) ||
      desc.includes(search);

    const locationMatch = !location || row[1] === location;

    return searchMatch && locationMatch;
  });

  renderTable(filtered);
}

document.getElementById("searchInput").addEventListener("input", filterData);
document.getElementById("locationFilter").addEventListener("change", filterData);
